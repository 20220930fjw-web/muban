<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站预览 — asme-landing & lgpsm-fashion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }
  h1 { font-size: 2.2rem; margin-bottom: 12px; }
  p.subtitle { color: #94a3b8; margin-bottom: 40px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 800px;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 28px;
    text-decoration: none;
    color: #e2e8f0;
    transition: all 0.25s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card:hover {
    border-color: #3b82f6;
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(59,130,246,0.15);
  }
  .card h2 { font-size: 1.2rem; }
  .card .desc { font-size: 0.88rem; color: #94a3b8; line-height: 1.5; }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 999px;
    background: #1e3a5f;
    color: #93c5fd;
    width: fit-content;
  }
</style>
</head>
<body>
  <h1>网站预览</h1>
  <p class="subtitle">muban 子模块构建产物，点击卡片查看完整网站</p>
  <div class="grid">
    <a class="card" href="asme-landing/index.html">
      <span class="badge">Vite + React + TS</span>
      <h2>Asme — Know it then all</h2>
      <span class="desc">未来感创新平台落地页，含 Hero、About、Services、Philosophy、FeaturedVideo 等模块</span>
    </a>
    <a class="card" href="lgpsm-fashion/index.html">
      <span class="badge">Vite + React + TS</span>
      <h2>LGPSM — Future Forward Fashion</h2>
      <span class="desc">极简白色未来风时尚网站，含 Header、Hero、线框地球、抽屉式购物/系列/日志面板</span>
    </a>
  </div>
</body>
</html>
